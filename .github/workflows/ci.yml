name: VisionQA CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Run smoke matrix tests"
        required: true
        default: false
        type: boolean

jobs:
  basic-checks:
    name: Temel Kontroller
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4
      
      - name: README kontrolü
        run: |
          test -f "README.md" && echo "✅ README.md var" || (echo "❌ README.md yok" && exit 1)
      
      - name: Proje yapısı kontrolü
        run: |
          echo "📁 Proje klasörleri kontrol ediliyor..."
          for dir in backend frontend docs .github; do
            test -d "$dir" && echo "✅ $dir klasörü var" || (echo "❌ $dir yok" && exit 1)
          done

  docker-checks:
    name: Docker Kontrolleri
    runs-on: ubuntu-latest
    needs: basic-checks
    
    steps:
      - uses: actions/checkout@v4
      
      - name: docker-compose.yml kontrolü
        run: |
          test -f "docker-compose.yml" && echo "✅ docker-compose.yml var"
          docker compose config > /dev/null && echo "✅ docker-compose.yml syntax doğru"

  backend-tests:
    name: Backend Testleri
    runs-on: ubuntu-latest
    needs: docker-checks
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Backend dosya kontrolü
        run: |
          cd backend
          test -f main.py && echo "✅ main.py var"
          test -d database && echo "✅ database klasörü var"
          test -f requirements.txt && echo "✅ requirements.txt var"
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      
      - name: Python syntax kontrolü
        run: |
          cd backend
          python -m py_compile main.py database/__init__.py database/models.py schemas.py
          echo "✅ Python dosyaları syntax hatası yok"
      
      - name: Module import kontrolü
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:.
          python -c "import main; print('✅ main.py import edildi')"
          python -c "import database; print('✅ database import edildi')"
          python -c "from database import models; print('✅ models import edildi')"
          python -c "import schemas; print('✅ schemas import edildi')"
          python -c "from fastapi import FastAPI; print('✅ FastAPI import edildi')"
      
      - name: Alembic konfigürasyon kontrolü
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:.
          test -f alembic.ini && echo "✅ alembic.ini var"
          test -f alembic/env.py && echo "✅ alembic/env.py var"
          python -c "from alembic.config import Config; Config('alembic.ini'); print('✅ Alembic config geçerli')"

      - name: Router import kontrolü
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:.
          python -c "from routers.stats_router import router; print('✅ stats_router import OK')"
          python -c "from routers.projects_router import router; print('✅ projects_router import OK')"
          python -c "from routers.api_test_router import router; print('✅ api_test_router import OK')"
          python -c "from routers.db_test_router import router; print('✅ db_test_router import OK')"
          python -c "from routers.scenario_router import router; print('✅ scenario_router import OK')"
          python -c "from routers.report_router import router; print('✅ report_router import OK')"
          python -c "from database.models import Project, TestCase, TestRun, Finding; print('✅ Tüm modeller import OK')"

      - name: Core AI & Orchestration modül kontrolü
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:.
          python -c "from core.models.llm_client import LLMClient; print('✅ LLMClient import OK')"
          python -c "from core.models.sam3_client import SAM3Client; print('✅ SAM3Client import OK')"
          python -c "from core.models.dinox_client import DINOXClient; print('✅ DINOXClient / Grounding DINO fallback import OK')"
          python -c "from core.models.vision_provider import VisionProviderManager; print('✅ VisionProviderManager import OK')"
          python -c "from core.agents.case_generator import AICaseGenerator; print('✅ AICaseGenerator import OK')"
          python -c "from core.scenario_executor import ScenarioExecutor; print('✅ ScenarioExecutor import OK')"
          python -c "from executors.api.api_executor import APIExecutor; print('✅ APIExecutor import OK')"
          python -c "from executors.database.db_executor import DatabaseExecutor; print('✅ DatabaseExecutor import OK')"
          python -c "from core.models.llm_client import LLMClient; assert hasattr(LLMClient, 'IDENTITY_SYSTEM_PROMPT'); print('✅ System Prompt sabitleri mevcut')"
          echo "✅ Core modülleri sorunsuz"

      - name: Run Backend Tests (Pytest)
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:.
          pip install pytest pytest-asyncio httpx
          if [ -d "tests" ] && [ "$(ls -A tests/)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "⚠️ Henüz test dosyası yok, adım atlanıyor."
          fi

  smoke-tests:
    name: Smoke Matrix Testleri
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_smoke == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Start backend stack
        run: |
          docker compose up -d postgres redis backend

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/health > /dev/null; then
              echo "✅ Backend health OK"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Backend health check timeout"
          docker compose logs backend
          exit 1

      - name: Run smoke tests
        working-directory: ./backend
        env:
          VISIONQA_RUN_SMOKE: "1"
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest -m smoke tests/test_smoke_matrix.py -v --tb=short

      - name: Stop backend stack
        if: always()
        run: docker compose down


  frontend-tests:
    name: Frontend Testleri
    runs-on: ubuntu-latest
    needs: docker-checks
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Bağımlılıkları yükle
        run: |
          cd frontend
          npm ci
          echo "✅ Frontend bağımlılıkları yüklendi"
          
      - name: Lint kontrolü (Kod Kalitesi)
        run: |
          cd frontend
          npm run lint
          echo "✅ Frontend lint kontrolü başarılı"

      - name: Build kontrolü (Derleme)
        run: |
          cd frontend
          npm run build
          echo "✅ Frontend başarıyla derlendi"

  success-notification:
    name: ✅ Tüm Kontroller Başarılı
    runs-on: ubuntu-latest
    needs: [basic-checks, docker-checks, backend-tests, frontend-tests]
    
    steps:
      - name: Başarı mesajı
        run: |
          echo "🎉 Tebrikler! Tüm CI/CD kontrolleri başarılı!"
          echo "✅ Temel kontroller: PASSED"
          echo "✅ Docker kontrolleri: PASSED"
          echo "✅ Backend testleri: PASSED"
          echo "✅ Frontend testleri: PASSED"
